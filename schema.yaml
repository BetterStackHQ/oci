title: Better Stack
description: Forward Oracle Cloud metrics and logs to Better Stack.
stackDescription: Forwards Oracle Cloud metrics and logs to Better Stack.
informationalText: Run this stack in the home region of your tenancy. It creates a betterstack compartment with a forwarder Function and Connector Hubs.
# The console only loads images from data: URIs and Oracle domains, so the logo is inline (logo.png).
logoUrl: data:image/png;base64,
schemaVersion: 1.1.0
version: "20261112"
locale: en

variableGroups:
  - title: Better Stack source
    variables:
      - ${betterstack_ingesting_host}
      - ${betterstack_source_token}
  - title: Metrics
    variables:
      - ${metrics_compartment_ids}
      - ${metrics_namespaces}
  - title: Logs
    variables:
      - ${forward_audit_logs}
      - ${log_group_ids}
  - title: Hidden
    visible: false
    variables:
      - ${tenancy_ocid}
      - ${region}

variables:
  betterstack_ingesting_host:
    title: Ingesting host
    description: Shown on your source's Ingest tab, for example s1234.eu-nbg-2.betterstackdata.com.
    type: string
    required: true
    pattern: "^\\s*(https?://)?[A-Za-z0-9.-]+(:[0-9]+)?/?\\s*$"

  betterstack_source_token:
    title: Source token
    type: password
    required: true
    sensitive: true

  metrics_compartment_ids:
    title: Compartments
    description: Compartment OCIDs to forward metrics from, separated by commas or new lines. Leave empty for every compartment that exists when you apply. Apply again after you add compartments.
    type: text
    multiline: true
    required: false

  metrics_namespaces:
    title: Metric namespaces
    description: Forwarded from every compartment, including services you start using later. Each Connector Hub covers 2 compartments with all 25 namespaces, and 5 with 10 or fewer. Clear the list to forward logs only.
    type: enum
    additionalProps:
      allowMultiple: true
    required: false
    default:
      - oci_autonomous_database
      - oci_blockstore
      - oci_compute_infrastructure_health
      - oci_computeagent
      - oci_computecontainerinstance
      - oci_database
      - oci_database_cluster
      - oci_dynamic_routing_gateway
      - oci_faas
      - oci_fastconnect
      - oci_filestorage
      - oci_gpu_infrastructure_health
      - oci_lbaas
      - oci_mysql_database
      - oci_nat_gateway
      - oci_nlb
      - oci_objectstorage
      - oci_oke
      - oci_queue
      - oci_rdma_infrastructure_health
      - oci_service_gateway
      - oci_vcn
      - oci_vpn
      - oci_waf
      - oracle_oci_database
    enum:
      - oci_autonomous_database
      - oci_blockstore
      - oci_compute_infrastructure_health
      - oci_computeagent
      - oci_computecontainerinstance
      - oci_database
      - oci_database_cluster
      - oci_dynamic_routing_gateway
      - oci_faas
      - oci_fastconnect
      - oci_filestorage
      - oci_gpu_infrastructure_health
      - oci_lbaas
      - oci_mysql_database
      - oci_nat_gateway
      - oci_nlb
      - oci_objectstorage
      - oci_oke
      - oci_queue
      - oci_rdma_infrastructure_health
      - oci_service_connector_hub
      - oci_service_gateway
      - oci_vcn
      - oci_vpn
      - oci_waf
      - oracle_oci_database

  forward_audit_logs:
    title: Forward audit logs
    description: Audit events from every compartment in the tenancy.
    type: boolean

  log_group_ids:
    title: Log groups
    description: Log group OCIDs to forward, separated by commas or new lines.
    type: text
    multiline: true
    required: false

outputs:
  betterstack_sources_url:
    type: link
    title: View in Better Stack
    visible: true
  betterstack_compartment_id:
    type: ocid
    title: Compartment
    visible: true

primaryOutputButton: ${betterstack_sources_url}
