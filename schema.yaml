title: Better Stack
description: Forward Oracle Cloud metrics and logs to Better Stack.
schemaVersion: 1.1.0
version: "20261027"
locale: en

variableGroups:
  - title: Better Stack source
    variables:
      - ${betterstack_ingesting_host}
      - ${betterstack_source_token}
  - title: Metrics
    variables:
      - ${metrics_compartment_ids}
      - ${metrics_namespaces}
  - title: Logs
    variables:
      - ${forward_audit_logs}
      - ${log_group_ids}
  - title: Advanced
    variables:
      - ${forwarder_image}
  - title: Hidden
    visible: false
    variables:
      - ${tenancy_ocid}
      - ${region}

variables:
  betterstack_ingesting_host:
    title: Ingesting host
    description: Shown on your source's Configure page, for example s1234.eu-nbg-2.betterstackdata.com.
    type: string
    required: true

  betterstack_source_token:
    title: Source token
    type: password
    required: true
    sensitive: true

  metrics_compartment_ids:
    title: Compartments
    description: Comma-separated compartment OCIDs to forward metrics from. Leave empty for every compartment.
    type: text
    multiline: true
    required: false

  metrics_namespaces:
    title: Metric namespaces
    type: enum
    additionalProps:
      allowMultiple: true
    required: true
    default:
      - oci_autonomous_database
      - oci_blockstore
      - oci_compute_infrastructure_health
      - oci_computeagent
      - oci_computecontainerinstance
      - oci_database
      - oci_database_cluster
      - oci_dynamic_routing_gateway
      - oci_faas
      - oci_fastconnect
      - oci_filestorage
      - oci_gpu_infrastructure_health
      - oci_lbaas
      - oci_mysql_database
      - oci_nat_gateway
      - oci_nlb
      - oci_objectstorage
      - oci_oke
      - oci_queue
      - oci_rdma_infrastructure_health
      - oci_service_gateway
      - oci_vcn
      - oci_vpn
      - oci_waf
      - oracle_oci_database
    enum:
      - oci_autonomous_database
      - oci_blockstore
      - oci_compute_infrastructure_health
      - oci_computeagent
      - oci_computecontainerinstance
      - oci_database
      - oci_database_cluster
      - oci_dynamic_routing_gateway
      - oci_faas
      - oci_fastconnect
      - oci_filestorage
      - oci_gpu_infrastructure_health
      - oci_lbaas
      - oci_mysql_database
      - oci_nat_gateway
      - oci_nlb
      - oci_objectstorage
      - oci_oke
      - oci_queue
      - oci_rdma_infrastructure_health
      - oci_service_connector_hub
      - oci_service_gateway
      - oci_vcn
      - oci_vpn
      - oci_waf
      - oracle_oci_database

  forward_audit_logs:
    title: Forward audit logs
    description: Audit events from every compartment in the tenancy.
    type: boolean

  log_group_ids:
    title: Log groups
    description: Comma-separated log group OCIDs to forward.
    type: text
    multiline: true
    required: false

  forwarder_image:
    title: Forwarder image
    description: Leave empty to use the image Better Stack publishes in your region.
    type: string
    required: false
